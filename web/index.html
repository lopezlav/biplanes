<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Bluetooth Biplanes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="res/icon.png">
<link rel="apple-touch-icon" href="res/icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #c9ccd3; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* No text selection, no long-press menu or loupe, no tap flash, no zoom */
  *, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  button { outline: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #screen { position: relative; display: block; box-shadow: 0 0 40px #0008; }
  /* blurred copy of the picture behind the side bars */
  #backdrop { position: fixed; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); filter: blur(28px) brightness(.55) saturate(1.25); }
  .cover { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; text-align: center; background: #000a; color: #fff; font: 700 18px/1.5 system-ui, sans-serif; letter-spacing: .02em; padding: 16px; cursor: pointer; }
  .cover[hidden] { display: none; }
  #start.ready { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { color: #ffd84a; } }

  /* round, see-through buttons over the game */
  .ui { position: fixed; z-index: 10; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; color: #fff; font: 700 13px system-ui, sans-serif; letter-spacing: .06em; background: #0000004d; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: inset 0 0 0 2px #ffffff55; touch-action: none; cursor: pointer; transition: transform .06s, background .06s; }
  .ui.down { transform: scale(.92); background: #ffffff40; }
  .pill { height: 40px; min-width: 52px; padding: 0 14px; border-radius: 20px; font-size: 12px; }
  #fs { top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); width: 40px; min-width: 40px; padding: 0; font-size: 18px; opacity: .7; }
  #fs[hidden] { display: none; }

  /* desktop key help, fades out */
  #hint { position: fixed; z-index: 10; left: 50%; bottom: 14px; transform: translateX(-50%); margin: 0; padding: 7px 14px; border-radius: 18px; background: #000000a0; font-size: 12px; white-space: nowrap; transition: opacity 1s; }
  #hint b { color: #fff; font-weight: 600; }
  #hint.gone { opacity: 0; }

  /* touch controls: shown only while flying, in their own space beside or
     below the game (body.portrait / body.landscape, --panel = space below) */
  #touch { display: none; }
  body.touch #hint, body.touch #fs { display: none; }
  body.touch #touch { display: block; }
  #touch > * { transition: opacity .25s, transform .06s, background .06s; }
  body:not(.playing) #touch > * { opacity: 0; pointer-events: none; }
  #stickzone { position: fixed; z-index: 5; left: 0; top: 0; bottom: 0; width: 50%; touch-action: none; }
  #stickhint { position: fixed; z-index: 4; width: 120px; height: 120px; border-radius: 50%; box-shadow: inset 0 0 0 2px #ffffff40; background: radial-gradient(circle, #ffffff30 0 25%, #ffffff10 26% 100%); pointer-events: none; }
  #stickhint.hide { opacity: 0; }
  .round { border-radius: 50%; }
  #fire { width: 92px; height: 92px; background: #d2502d99; font-size: 15px; }
  #eject { width: 62px; height: 62px; background: #2f6db599; font-size: 11px; }
  #pause { width: 46px; height: 40px; min-width: 46px; padding: 0; font-size: 16px; }

  body.portrait #stickhint { left: calc(28px + env(safe-area-inset-left)); bottom: calc(var(--panel) / 2 - 60px); }
  body.portrait #fire { right: calc(24px + env(safe-area-inset-right)); bottom: calc(var(--panel) / 2 - 46px); }
  body.portrait #eject { right: calc(128px + env(safe-area-inset-right)); bottom: calc(var(--panel) / 2 - 56px); }
  body.portrait #pause { right: calc(24px + env(safe-area-inset-right)); bottom: calc(var(--panel) - 52px); }

  body.landscape #stickhint { left: calc(24px + env(safe-area-inset-left)); bottom: calc(28px + env(safe-area-inset-bottom)); }
  body.landscape #fire { right: calc(28px + env(safe-area-inset-right)); bottom: calc(32px + env(safe-area-inset-bottom)); }
  body.landscape #eject { right: calc(44px + env(safe-area-inset-right)); bottom: calc(140px + env(safe-area-inset-bottom)); }
  body.landscape #pause { right: calc(16px + env(safe-area-inset-right)); top: calc(14px + env(safe-area-inset-top)); }

  /* reads the safe-area sizes for the layout code */
  #safe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
</head>
<body>
  <canvas id="backdrop"></canvas>
  <main id="stage">
    <canvas id="screen"></canvas>
  </main>
  <div id="start" class="cover">Loading…</div>
  <div id="closed" class="cover" hidden>Game closed.<br>Click to play again.</div>
  <p id="hint"><b>WASD</b> fly · <b>Space</b> fire · <b>E</b> eject · <b>Enter</b> select · <b>Esc</b> back / pause · <b>F</b> full screen</p>
  <button class="ui pill" id="fs" hidden title="Full screen">⛶</button>
  <div id="touch">
    <div id="stickzone"></div>
    <div id="stickhint"></div>
    <button class="ui round" id="fire" data-key="-5">FIRE</button>
    <button class="ui round" id="eject" data-key="42">EJECT</button>
    <button class="ui pill" id="pause" data-key="-7" title="Pause">❚❚</button>
  </div>
  <div id="safe"></div>
<script src="vendor/nipplejs.js"></script>
<script src="js/midp.js"></script>
<script src="js/font.js"></script>
<script src="js/menu.js"></script>
<script src="js/sound.js"></script>
<script src="js/input.js"></script>
<script src="js/entities.js"></script>
<script src="js/link.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
